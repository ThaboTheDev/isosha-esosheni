org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 9 defaults to the new Android DSL and to built-in Kotlin. Both opt-outs below are
# required for this project (and for the Flutter plugins it depends on) and are set by
# the Flutter template/migrator:
#  - newDsl=false keeps the legacy AGP DSL types readable, so the build scripts of
#    Flutter plugins that have not migrated yet keep working.
#  - builtInKotlin=false keeps Kotlin support on the legacy Kotlin Gradle Plugin (KGP),
#    which Flutter's Gradle plugin applies to every module that applies AGP without
#    declaring KGP itself (see android/settings.gradle.kts).
# Do not remove these while any plugin in the dependency tree still applies KGP.
android.newDsl=false
android.builtInKotlin=false
