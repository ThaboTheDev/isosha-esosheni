# Gradle 9.3.1 is the version the Flutter 3.47 Android template pins, and it is the
# minimum required by AGP 9.1.0 (see android/settings.gradle.kts).
#
# Do not downgrade below 8.14.0: the Flutter Gradle plugin (3.47+) refuses to load and
# fails the build with:
#   Error: Your project's Gradle version (x.y.z) is lower than Flutter's minimum
#   supported version of 8.14.0. Please upgrade your Gradle version.
# (AGP 8.11-8.13 need >= 8.14, AGP 9.0 needs >= 9.1, AGP 9.1 needs >= 9.3.1.)
#
# NOTE: Android Studio rewrites this file if Gradle is configured to run from a
# "specified location" - keep it on "gradle-wrapper.properties (default)".
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
