name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  analyze-and-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Must satisfy pubspec: sdk >=3.4, flutter >=3.22
          flutter-version: "3.24.5"
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis (errors + warnings are fatal)
        id: analyze
        continue-on-error: true
        run: |
          flutter analyze | tee analyze-ci.log
          exit "${PIPESTATUS[0]}"

      # TEMPORARY debug hook: publish the analyzer log on the PR so it can
      # be inspected from environments where Actions log storage is
      # unreachable. Remove once analyze is green.
      - name: Publish analyze log on failure
        if: steps.analyze.outcome == 'failure'
        run: |
          NUM=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number')
          {
            echo "**flutter analyze log** (run $GITHUB_RUN_ID)"
            echo '```'
            cat analyze-ci.log
            echo '```'
          } > /tmp/comment.md
          for attempt in 1 2 3; do
            gh pr comment "$NUM" --body-file /tmp/comment.md && break
            sleep 20
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail job if analysis failed
        if: steps.analyze.outcome == 'failure'
        run: exit 1

      - name: Unit / widget / repository tests
        run: flutter test --reporter compact
