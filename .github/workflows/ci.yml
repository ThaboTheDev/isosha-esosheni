name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          # Must satisfy: pubspec sdk >=3.4 / flutter >=3.22, the intl 0.20.2 pin
          # (bundled by flutter_localizations from Flutter 3.27 on), and the Android
          # toolchain pins (Gradle 9.3.1 / AGP 9.1.0 / KGP 2.4.0) from Flutter 3.47.
          # With 3.24.5, `flutter pub get` fails to solve intl 0.19.0 (SDK) vs 0.20.2.
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Static analysis (errors + warnings are fatal)
        run: flutter analyze --no-fatal-infos

      - name: Unit / widget / repository tests
        run: flutter test --reporter compact
