name: isosha_esosheni
description: >-
  Isosha Esosheni — relationships, courtship, marriage and community for
  members of The Revelation Spiritual Home Kingdom. Native mobile client
  for the Isosha Esosheni web platform (Supabase backend).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  # Flutter 3.32 is the oldest SDK whose flutter_localizations accepts intl 0.20.2
  # (3.27-3.29 pin intl 0.19.0; 3.32-3.44 pin 0.20.2; 3.47 pins ^0.20.3).
  # Android builds additionally need Flutter 3.47+ - see README "Requirements".
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.8.0
  go_router: ^14.6.2
  flutter_riverpod: ^2.6.1
  # Must stay compatible with the intl version flutter_localizations brings in:
  # Flutter 3.44 pins intl 0.20.2, Flutter 3.47 pins ^0.20.3. An exact `0.20.2` pin
  # therefore breaks `flutter pub get` on Flutter 3.47+ ("version solving failed").
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  # Pinned (not caret) on purpose — see the dependency_overrides block below.
  # record 5.x is unbuildable today: it pins record_linux ^0.7.x, and the 0.7
  # line was never updated for record_platform_interface 1.4+, so the kernel
  # snapshot fails on *every* target, including Android. 6.2.1 is the release
  # whose whole platform family agrees with its platform interface, and it keeps
  # the Flutter >=3.24 floor this project needs (record 7.x requires Flutter
  # 3.44+/Dart 3.12 — switch to it once the project's Flutter floor is raised).
  record: 6.2.1
  just_audio: ^0.9.40
  video_player: ^2.9.1
  chewie: ^1.8.1
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  app_links: ^6.3.2
  webview_flutter: ^4.10.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

# ---------------------------------------------------------------------------
# Federated-plugin pinning (record)
#
# `record` is federated: one platform-interface package plus one package per
# platform (android / ios / macos / linux / windows / web). Flutter compiles
# *all* of them into the kernel snapshot — the desktop ones included — even for
# an Android-only build. So the whole family has to move in lockstep with the
# platform interface; one stale member breaks the build for every target:
#
#   ../../AppData/Local/Pub/Cache/hosted/pub.dev/record_linux-0.7.2/lib/record_linux.dart:12:7:
#   Error: The non-abstract class 'RecordLinux' is missing implementations for
#   these members: - RecordMethodChannelPlatformInterface.startStream
#   Target kernel_snapshot_program failed: Exception
#
# That is exactly what record 5.x hit: it constrains record_linux to ^0.7.x,
# the newest 0.7.x is 0.7.2 (2024-06-26) and predates `startStream`, while
# record_platform_interface resolved to 1.6.0. There is no fix inside the 5.x
# range, hence the move to 6.2.1.
#
# The overrides below freeze the family on the set record 6.2.1 resolves to
# (every member accepts record_platform_interface 1.6.x, which is the latest
# 1.x — 2.x belongs to the record 7 line). Bump them together, never one at a
# time, and re-run `flutter build apk --release` after any change here.
dependency_overrides:
  record_platform_interface: 1.6.0
  record_android: 1.5.2
  record_ios: 1.2.1
  record_macos: 1.2.2
  record_linux: 1.3.1
  record_windows: 1.0.7
  record_web: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/CormorantGaramond-Bold.ttf
          weight: 700
